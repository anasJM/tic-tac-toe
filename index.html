<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tic tac toe</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Let's play X/O</h1>
        <h3 class="turn"></h3>
        <div class="board">
            <button class="cell" data-row="1" data-column="1"></button>
            <button class="cell" data-row="1" data-column="2"></button>
            <button class="cell" data-row="1" data-column="3"></button>
            <button class="cell" data-row="2" data-column="1"></button>
            <button class="cell" data-row="2" data-column="2"></button>
            <button class="cell" data-row="2" data-column="3"></button>
            <button class="cell" data-row="3" data-column="1"></button>
            <button class="cell" data-row="3" data-column="2"></button>
            <button class="cell" data-row="3" data-column="3"></button>
        </div>
        <button class="reset-button">Play again</button>

        <!-- modal -->
        <div class="modal">
            <h1>Enter the players name!</h1>
            <form action="get">
                <div>
                    <div class="divInputs">
                        <label for="player-one" class="label">Player 1</label>
                        <input type="text" name="player-one" id="player-one" class="inputs">
                    </div>

                    <div class="divInputs">
                        <label for="player-two" class="label">Player 2</label>
                        <input type="text" name="player-two" id="player-two" class="inputs">
                    </div>
                </div>

                <button type="submit" class="submit-button">Let's play!</button>
            </form>
        </div>
    </div>
</body>
</html>
